name: Video TikTok hằng ngày
# Tên lượt chạy ghi rõ video gì, để bước kiểm tra nhận ra video "ngày mai" đã làm hôm nay chưa.
run-name: Video ${{ inputs.topic && format('chủ đề {0}', inputs.topic) || inputs.date || 'ngày mai' }}

on:
  # Chính: tác vụ hẹn giờ của Claude (16:20 giờ VN) bấm chạy workflow này.
  # Dự phòng: lịch của GitHub 17:15 và 18:15 giờ VN (GitHub hay trễ, đôi khi bỏ lỡ). Lượt dự phòng tự bỏ qua
  # nếu hôm nay (giờ VN) đã có lượt "Video ngày mai" thành công, nên không gửi trùng.
  # Có thể bấm Run workflow bằng tay bất cứ lúc nào.
  schedule:
    - cron: "15 10 * * *"
    - cron: "15 11 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Ngày làm video (YYYY-MM-DD), bỏ trống = ngày mai"
        required: false
      topic:
        description: "Video chủ đề: số video (vd 01). Có số này thì bỏ qua ô ngày"
        required: false
      voice:
        description: "Giọng VieNeu (Mai Anh, Ngọc Huyền, Đoan Trang, Trúc Ly, Ngọc Linh)"
        required: false
        default: "Mai Anh"

permissions:
  contents: read
  actions: read

concurrency:
  group: tiktok-daily
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      done: ${{ steps.c.outputs.done }}
    steps:
      - id: c
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
        run: |
          n=0
          if [ "$EVENT" = "schedule" ]; then
            since=$(date -u -d "$(TZ=Asia/Ho_Chi_Minh date +%Y-%m-%d) 00:00 +0700" +%Y-%m-%dT%H:%M:%SZ)  # 0h giờ VN, viết theo UTC
            # Mọi lượt "Video ngày mai" thành công từ 0h hôm nay (giờ VN), dù do Claude, lịch GitHub hay bấm tay.
            n=$(gh api "repos/$REPO/actions/workflows/tiktok.yml/runs?status=success&created=>=$since&per_page=50" \
              -q '[.workflow_runs[] | select(.display_title == "Video ngày mai")] | length')
          fi
          echo "done=$([ "$n" -gt 0 ] && echo 1 || echo 0)" >> "$GITHUB_OUTPUT"
          echo "Lượt video ngày mai đã thành công hôm nay: $n"

  video:
    needs: check
    if: needs.check.outputs.done != '1'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      FONT_DIR: ${{ github.workspace }}/marketing/tiktok/fonts
      OUT_DIR: ${{ github.workspace }}/marketing/tiktok/out
      TTS_VOICE: ${{ inputs.voice || 'Mai Anh' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: marketing/tiktok/requirements.txt

      - name: Cài công cụ
        timeout-minutes: 16
        run: |
          for i in 1 2 3; do
            timeout 300 sudo apt-get install -y -qq --no-install-recommends ffmpeg > /dev/null && break
            sudo apt-get update -qq || true
          done
          ffmpeg -version | head -1
          pip install -q -r marketing/tiktok/requirements.txt

      - name: Bộ nhớ đệm mô hình giọng đọc
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: vieneu-v3turbo-1

      - name: Tải phông chữ (giấy phép OFL)
        run: |
          mkdir -p "$FONT_DIR"
          base=https://raw.githubusercontent.com/google/fonts/main/ofl
          curl -fsSL -o "$FONT_DIR/BeVietnamPro-SemiBold.ttf" $base/bevietnampro/BeVietnamPro-SemiBold.ttf
          curl -fsSL -o "$FONT_DIR/BeVietnamPro-Bold.ttf" $base/bevietnampro/BeVietnamPro-Bold.ttf
          curl -fsSL -o "$FONT_DIR/PlayfairDisplay-VF.ttf" "$base/playfairdisplay/PlayfairDisplay%5Bwght%5D.ttf"

      - name: Dựng video
        # Ô nhập được truyền qua biến môi trường và kiểm tra định dạng, không chèn thẳng vào lệnh shell.
        env:
          IN_DATE: ${{ inputs.date }}
          IN_TOPIC: ${{ inputs.topic }}
        run: |
          if [ -n "$IN_TOPIC" ]; then
            [[ "$IN_TOPIC" =~ ^[0-9]{1,3}$ ]] || { echo "::error::Số chủ đề không hợp lệ: chỉ gồm chữ số (vd 01)"; exit 1; }
            python marketing/tiktok/build.py --topic "$IN_TOPIC"
          elif [ -n "$IN_DATE" ]; then
            [[ "$IN_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "::error::Ngày không hợp lệ, cần dạng YYYY-MM-DD"; exit 1; }
            python marketing/tiktok/build.py "$IN_DATE"
          else
            python marketing/tiktok/build.py
          fi

      - name: Gửi qua Gmail
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          if [ -z "$GMAIL_USER" ] || [ -z "$GMAIL_APP_PASSWORD" ]; then
            # Báo lỗi (không báo thành công): video không đến được tay bạn, và lượt dự phòng cần chạy lại.
            echo "::error::Chưa có GMAIL_USER / GMAIL_APP_PASSWORD trong Secrets, video không được gửi"
            exit 1
          fi
          if ! ls "$OUT_DIR"/linhco-*.mp4 >/dev/null 2>&1; then echo "::notice::Ngày đặc biệt – chủ động không làm video tự động"; exit 0; fi
          python marketing/tiktok/send_mail.py "$OUT_DIR"/linhco-*.mp4 "$OUT_DIR/kich-ban.txt"
